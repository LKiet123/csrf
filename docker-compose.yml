# version: '3.8'

volumes:
  mysql-data:
  redis-data:  # Thêm volume cho Redis

networks:
  app-network:  # Thêm network tùy chỉnh

services:
  web-backend:
    build: ./config/backend
    container_name: web-backend
    ports:
      - 8080:80
    volumes:
      - D:\LDPlayer\11-training-php\src:/var/www/html/ 
      - ./config/backend/php.ini:/usr/local/etc/php/php.ini
      - ./config/httpd_security.conf:/etc/apache2/conf-available/security.conf
    working_dir: /var/www/html
    environment:
      APP_ENV: local
    depends_on:
      - web-mysql
    networks:
      - app-network
    restart: always

  web-mysql:
    container_name: web-mysql
    image: "mysql:5.7.43"
    ports:
        - 3306:3306
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app_web1
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    networks:
      - app-network

  web-phpmyadmin:
    container_name: phpmyadmin
    image: phpmyadmin/phpmyadmin
    links:
      - web-mysql:mysql
    ports:
      - "8081:80"
    environment:
      PMA_HOST: web-mysql
      MYSQL_ROOT_PASSWORD: root
    networks:
      - app-network
      
  redis:
    image: redis:7.2
    container_name: myredis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data  # Thêm volume để persist dữ liệu Redis
    command: redis-server --requirepass mypassword
    networks:
      - app-network